# Deploy with: npx wrangler deploy   (after `npx wrangler login`)
name = "start-em-share"
main = "share-worker.js"
compatibility_date = "2026-11-01"

[vars]
ORIGIN = "https://YOUR-GITHUB-USER.github.io/start-em/"
SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co"
SUPABASE_ANON_KEY = "YOUR-ANON-OR-PUBLISHABLE-KEY"

# Then in the Cloudflare dashboard: Workers > start-em-share > Settings > Domains & Routes,
# add your domain (e.g. startem.gg) so the whole site runs through this worker.
